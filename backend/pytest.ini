[pytest]
# ---------------------------------------------------------------------------
# KinderLog backend - pytest configuration
# ---------------------------------------------------------------------------
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider

# Markers for selective runs
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that need real DB
    e2e: marks end-to-end tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage options (used when invoked with --cov)
[coverage:run]
source =
    app.services.bug_report_service
    app.api.endpoints.bug_reports
    app.tasks.bug_report_notifications
    app.schemas.bug_report
omit =
    */tests/*
    */__init__.py
    */migrations/*

[coverage:report]
precision = 1
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
