name: Flutter Analysis

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter environment
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Run Flutter Analyze
      run: |
        echo "Mocking Flutter Analyze... Workspace is currently empty."
        echo "CI Passed! (Change this to 'flutter analyze' when frontend code is ready)"
