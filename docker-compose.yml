services:
  db:
    image: postgres:16-alpine
    container_name: kinderlog_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kinderlog_redis
    # --appendonly yes + volume: phiên đăng nhập (session:*) sống qua `docker compose
    # down`, không thì mọi máy bị đăng xuất sau mỗi lần restart stack.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: kinderlog_minio
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console (web UI)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: kinderlog_api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: kinderlog_worker
    # Host không có GPU NVIDIA: worker chạy CPU hoặc gửi request sang server GPU ngoài.
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Repo này đã có model.bin CTranslate2; repo vinai gốc là checkpoint PyTorch.
      PHOWHISPER_MODEL_ID: vudang449/PhoWhisper-large-ct2
      LD_LIBRARY_PATH: /opt/conda/lib/python3.11/site-packages/nvidia/cublas/lib:/opt/conda/lib/python3.11/site-packages/nvidia/cudnn/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
    # Worker này chỉ gửi thông báo (nhẹ, chạy tốt trên CPU).
    # Task audio được RunPod lo: host không có GPU nên chạy CPU sẽ rất chật.
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=info
      --concurrency=1
      -Q notifications

volumes:
  postgres_data:
  minio_data:
  redis_data: