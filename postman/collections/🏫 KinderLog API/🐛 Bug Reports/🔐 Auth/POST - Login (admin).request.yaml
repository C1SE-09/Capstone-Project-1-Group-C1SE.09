$kind: http-request
description: |-
  Login với tài khoản admin (username: `admin`, password: `123456`).

  **Test script** tự lưu `access_token` vào `admin_token` collection variable.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('admin_token', json.access_token);
          console.log('[admin] token saved, role=' + json.role + ', user_id=' + json.user_id);
      } else {
          console.error('[admin] login failed:', pm.response.text());
      }
    language: text/javascript
order: 1000
