$kind: http-request
description: |-
  **[Admin]** Đổi status: `resolved` → `closed` (user xác nhận OK, admin đóng ticket).

  - Tự động set `closed_at = NOW()`.
  - Ghi 1 history entry mới.
url: "{{base_url}}/api/bug-reports/{{bug_report_id_3_resolved}}"
method: PATCH
headers:
  Authorization: "Bearer {{admin_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "closed",
      "comment": "[Postman] User đã xác nhận app hoạt động bình thường. Đóng ticket."
    }
order: 6000
