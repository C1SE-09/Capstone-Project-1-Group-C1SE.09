$kind: http-request
description: |-
  **[Admin]** Đổi status: `in_progress` → `resolved` (đã fix xong).

  - Tự động set `resolved_at = NOW()`.
  - Ghi 1 history entry mới.
  - Celery task `notify_user_status_changed` được dispatch với status transition → resolved.

  Dùng `bug_report_id_2_in_progress` (hiện tại status=in_progress).
url: "{{base_url}}/api/bug-reports/{{bug_report_id_2_in_progress}}"
method: PATCH
headers:
  Authorization: "Bearer {{admin_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "resolved",
      "comment": "[Postman] Fix bằng cách kiểm tra FCM token hợp lệ trước khi subscribe. Build 1.2.4 đã deploy lên TestFlight."
    }
order: 5000
