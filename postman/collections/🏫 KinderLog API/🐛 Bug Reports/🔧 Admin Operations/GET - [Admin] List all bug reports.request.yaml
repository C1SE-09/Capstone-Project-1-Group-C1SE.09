$kind: http-request
description: |-
  **[Admin]** Lấy danh sách TẤT CẢ bug report (mọi user).

  Hỗ trợ filter qua query string:
  - `status` = open | in_progress | resolved | closed | wont_fix
  - `severity` = low | medium | high | critical
  - `category` = ui | performance | crash | data | notification | network | auth | other
  - `user_role` = teacher | parent | admin
  - `user_id` (UUID) — filter theo user cụ thể
  - `teacher_id` (UUID) — filter theo assignee
  - `search` — tìm theo title (case-insensitive substring)
  - `date_from`, `date_to` (ISO 8601) — filter theo khoảng thời gian
  - `order_by` = created_at_desc (default) | created_at_asc | severity_desc
  - `page`, `page_size` (1..100, default 20)

  Ví dụ này không filter gì, lấy 20 report mới nhất.
url: "{{base_url}}/api/bug-reports?page=1&page_size=20&order_by=created_at_desc"
method: GET
headers:
  Authorization: "Bearer {{admin_token}}"
queryParams:
  page: "1"
  page_size: "20"
  order_by: created_at_desc
order: 1000
