$kind: http-request
description: |-
  Upload thêm ảnh vào report đã tồn tại.

  - **Auth**: admin (hoặc author của report đó)
  - **Limit**: tổng số attachments ≤ 5 (MAX_ATTACHMENTS_PER_REPORT)
  - **File**: ảnh ≤ 5MB, MIME `image/*` hoặc `text/plain`

  Dùng `bug_report_id_1_open` (đã có sẵn 1 file attachment nếu bạn chạy POST đầu tiên).
url: "{{base_url}}/api/bug-reports/{{bug_report_id_1_open}}/attachments"
method: POST
headers:
  Authorization: "Bearer {{admin_token}}"
body:
  type: formdata
  content:
    - type: file
      key: attachments
      src:
        - ""
      description: File ảnh PNG / JPG muốn thêm vào report
order: 8000
