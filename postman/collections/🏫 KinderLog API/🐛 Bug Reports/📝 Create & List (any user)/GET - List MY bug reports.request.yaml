$kind: http-request
description: |-
  Lấy danh sách bug report CỦA TÔI (của user đang login).

  - **Phân trang**: 20 items / trang, mặc định `page=1`
  - **Sắp xếp**: mới nhất trước

  **Response 200:**
  ```json
  {
    "items": [
      {"bug_report_id": "...", "title": "...", "status": "open", "severity": "high", ...}
    ],
    "total": 5,
    "page": 1,
    "page_size": 20
  }
  ```
url: "{{base_url}}/api/bug-reports/me?page=1&page_size=20"
method: GET
headers:
  Authorization: "Bearer {{teacher_token}}"
queryParams:
  page: "1"
  page_size: "20"
order: 3000
