$kind: http-request
description: |-
  Lấy chi tiết 1 bug report CỦA TÔI (kèm attachments + history audit trail).

  - User chỉ xem được report do chính mình tạo (403 nếu xem của người khác).
  - Dùng `bug_report_id_1_open` (đã seed sẵn, status=open) làm ví dụ.

  **Response 200:** đầy đủ `attachments[]` + `history[]` (audit trail).
url: "{{base_url}}/api/bug-reports/me/{{bug_report_id_1_open}}"
method: GET
headers:
  Authorization: "Bearer {{teacher_token}}"
order: 4000
