$kind: http-request
description: |-
  Tạo bug report với chỉ 2 field bắt buộc (title + description).

  - `category` mặc định = `other`
  - `severity` mặc định = `medium`
  - `status` mặc định = `open`

  **Response 201:** giống POST đầy đủ, nhưng không có attachments, các field metadata = null.
url: "{{base_url}}/api/bug-reports"
method: POST
headers:
  Authorization: "Bearer {{parent_token}}"
body:
  type: formdata
  content:
    - type: text
      key: title
      value: "[Postman] Lỗi nhỏ: dropdown bị cắt chữ"
    - type: text
      key: description
      value: Khi mở dropdown chọn lớp trên màn hình nhỏ, chữ bị cắt ở dòng dưới.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.collectionVariables.set('bug_report_id', json.bug_report_id);
          console.log('[POST] bug_report_id saved:', json.bug_report_id);
      } else {
          console.error('[POST] create failed:', pm.response.text());
      }
    language: text/javascript
order: 2000
