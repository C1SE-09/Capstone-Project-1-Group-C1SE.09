$kind: collection
description: |-
  Postman Collection cho toàn bộ API của KinderLog Backend.

  ## Base URL
  `http://localhost:8000`

  ## Seed Data IDs
  | Loại | ID | Tên |
  |---|---|---|
  | School | `aaaaaaaa-0000-0000-0000-000000000001` | Trường Mầm Non Họa Mi |
  | Class A | `aaaaaaaa-0000-0000-0000-000000000001` | Lớp Mầm A |
  | Class B | `aaaaaaaa-0000-0000-0000-000000000002` | Lớp Mầm B |
  | Teacher 1 | `bbbbbbbb-0000-0000-0000-000000000001` | Cô Nguyễn Thị Mai |
  | Teacher 2 | `bbbbbbbb-0000-0000-0000-000000000002` | Cô Trần Thị Lan |
  | Parent 1 | `cccccccc-0000-0000-0000-000000000001` | Trần Văn Tuấn |
  | Child 1 | `dddddddd-0000-0000-0000-000000000001` | Trần Gia Bảo |
  | Child 2 | `dddddddd-0000-0000-0000-000000000002` | Lê Ngọc Ánh |

